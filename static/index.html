<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme Top Ten — The Factual Record Engine</title>
    <meta name="description" content="Objective top 10 lists of human feats, natural extremes, engineering marvels, and verified superlatives.">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --green: #4ade80;
            --amber: #fbbf24;
            --purple: #c084fc;
            --pink: #f472b6;
            --indigo: #818cf8;
        }
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .container { max-width: 920px; margin: 0 auto; padding: 1.1rem 0.9rem 3rem; }

        /* ---- header ---- */
        .hero { text-align: center; padding: 1.2rem 0 1rem; }
        .hero h1 {
            margin: 0 0 0.3rem; font-size: 1.7rem; letter-spacing: 2px; font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .hero .subtitle { color: var(--text-muted); font-size: 0.85rem; margin: 0; }

        /* ---- search ---- */
        .search-box { display: flex; gap: 8px; margin: 1rem 0 1.4rem; }
        input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: #fff; font-size: 16px; outline: none; min-width: 0; }
        input:focus { border-color: var(--accent); }
        .go-btn { padding: 12px 22px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--accent-hover), #7c3aed); color: white; cursor: pointer; font-weight: bold; font-size: 15px; white-space: nowrap; }
        .go-btn:active { transform: scale(0.97); }

        /* ---- sections ---- */
        .section-title { font-size: 1rem; margin: 0 0 0.7rem; display: flex; align-items: center; gap: 8px; }
        .section-title .hint { font-size: 0.72rem; color: var(--text-muted); font-weight: normal; }

        /* ---- trending grid: dense 2-col on mobile ---- */
        .trend-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 2rem; }
        @media (min-width: 700px) { .trend-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1000px) { .trend-grid { grid-template-columns: repeat(4, 1fr); } }
        .trend-card {
            background: var(--card-bg); border: 1px solid var(--border); border-top: 3px solid var(--cat, var(--accent));
            border-radius: 12px; padding: 0.7rem 0.75rem; cursor: pointer;
            transition: transform 0.15s, border-color 0.15s; display: flex; flex-direction: column;
        }
        .trend-card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .trend-emoji { font-size: 1.5rem; line-height: 1; margin-bottom: 0.35rem; }
        .trend-cat { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--cat, var(--accent)); font-weight: 700; margin-bottom: 0.25rem; }
        .trend-topic { font-weight: 700; font-size: 0.88rem; margin: 0 0 0.3rem; color: var(--text); line-height: 1.3; }
        .trend-teaser { font-size: 0.75rem; color: var(--text-muted); margin: 0 0 0.6rem; line-height: 1.4; flex: 1;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .trend-foot { display: flex; justify-content: space-between; align-items: center; }
        .trend-votes { font-size: 0.72rem; color: var(--text-muted); }
        .vote-btn { background: rgba(56,189,248,0.08); border: 1px solid var(--border); color: var(--text-muted);
            padding: 5px 10px; font-size: 0.72rem; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .vote-btn:hover { border-color: var(--accent); color: var(--accent); }
        .vote-btn.voted { border-color: var(--accent); color: var(--accent); cursor: default; }

        .recent-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 2rem; }
        .recent-chip { font-size: 0.8rem; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 20px; padding: 6px 13px; cursor: pointer; }
        .recent-chip:hover { color: var(--accent); border-color: var(--accent); }

        /* ---- results view ---- */
        #resultsView { display: none; }
        .res-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 0.8rem;
            position: sticky; top: 0; background: var(--bg); padding: 0.6rem 0; z-index: 5; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
            border-radius: 20px; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }
        .src-pill { font-size: 0.72rem; color: var(--text-muted); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; white-space: nowrap; }
        .src-pill.live { color: var(--green); border-color: var(--green); }
        .res-title { font-size: 1.35rem; margin: 0 0 0.4rem; line-height: 1.3; }
        .res-desc { color: var(--text-muted); font-size: 0.85rem; margin: 0 0 1.1rem; line-height: 1.55; }

        .res-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            margin-bottom: 0.6rem; overflow: hidden; }
        .res-row { display: flex; align-items: center; gap: 10px; padding: 0.75rem 0.9rem; cursor: pointer; }
        .res-row:active { background: rgba(56,189,248,0.05); }
        .medal { font-size: 1.3rem; flex-shrink: 0; width: 2rem; text-align: center; }
        .rank-num { font-size: 0.95rem; font-weight: 800; color: var(--accent); flex-shrink: 0; width: 2rem; text-align: center; }
        .res-name { flex: 1; font-weight: 600; font-size: 0.92rem; line-height: 1.35; min-width: 0; }
        .stat-badge { background: rgba(56,189,248,0.1); color: var(--accent); border: 1px solid var(--accent);
            padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
        .chev { color: var(--text-muted); font-size: 0.8rem; flex-shrink: 0; transition: transform 0.2s; }
        .res-item.open .chev { transform: rotate(180deg); }
        .res-detail { display: none; padding: 0 0.9rem 0.9rem 3.2rem; }
        .res-item.open .res-detail { display: block; }
        .res-detail p { color: #e2e8f0; font-size: 0.85rem; line-height: 1.6; margin: 0 0 0.6rem; }
        .res-meta { color: var(--text-muted); font-size: 0.72rem; display: flex; gap: 12px; flex-wrap: wrap;
            border-top: 1px dashed var(--border); padding-top: 0.5rem; }

        /* ---- loading ---- */
        .loading-box { text-align: center; padding: 3rem 1rem; }
        .spinner { width: 44px; height: 44px; margin: 0 auto 1rem; border-radius: 50%;
            border: 4px solid var(--border); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-msg { color: var(--text); font-size: 0.95rem; font-weight: 600; min-height: 1.4em; }
        .loading-sub { color: var(--text-muted); font-size: 0.78rem; margin-top: 0.5rem; }

        .err-card { background: var(--card-bg); border: 1px solid #ef4444; border-radius: 12px; padding: 1.2rem; }
        .err-card p { color: #ef4444; margin: 0; font-size: 0.9rem; }

        .src-tag { text-align: center; color: var(--text-muted); font-size: 0.75rem; margin-top: 2.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>⚡ EXTREME TOP TEN</h1>
            <p class="subtitle">Objective records, extreme measurements, verified superlatives.</p>
        </div>

        <div class="search-box">
            <input type="text" id="topicInput" placeholder="Try &quot;deepest caves&quot;…" onkeypress="handleKeyPress(event)">
            <button class="go-btn" onclick="fetchTopTen()">Generate</button>
        </div>

        <div id="homeView">
            <h2 class="section-title">🔥 Trending now <span class="hint">tap a card to generate its list</span></h2>
            <div id="trending" class="trend-grid"></div>

            <div id="recentWrap" style="display:none;">
                <h2 class="section-title">🕘 Recently generated <span class="hint">on this device</span></h2>
                <div id="recent" class="recent-row"></div>
            </div>
        </div>

        <div id="resultsView"></div>

        <div class="src-tag">extremetop10.com · impartial, data-informed top 10s</div>
    </div>

    <script>
        /* ============================================================
           MOCK popularity layer.
           Votes + recent history live in localStorage; trending list is
           a hand-picked seed. Later (real): GET /api/trending served from
           server-side counts of what visitors generate + their upvotes.
           ============================================================ */
        const CATS = {
            nature:      { emoji: "🌿", color: "#4ade80", label: "Nature" },
            engineering: { emoji: "🏗️", color: "#fbbf24", label: "Engineering" },
            human:       { emoji: "🏅", color: "#c084fc", label: "Human feats" },
            history:     { emoji: "📜", color: "#f472b6", label: "History" },
            space:       { emoji: "🚀", color: "#818cf8", label: "Space" }
        };
        const TRENDING_SEED = [
            { topic: "Tallest buildings in the world",   teaser: "The race for the sky — who owns it right now?", cat: "engineering", votes: 342 },
            { topic: "Deepest oceanic trenches",          teaser: "Down where the pressure crushes steel.",          cat: "nature",      votes: 318 },
            { topic: "Fastest land animals",             teaser: "Zero to prey in under three seconds.",            cat: "nature",      votes: 295 },
            { topic: "Largest earthquakes ever recorded",teaser: "The ground moved — a lot.",                       cat: "nature",      votes: 271 },
            { topic: "Tallest mountains on Earth",       teaser: "Eight-thousanders and the roof of the world.",    cat: "nature",      votes: 254 },
            { topic: "Fastest production cars",          teaser: "Street-legal machines chasing 500 km/h.",         cat: "engineering", votes: 238 },
            { topic: "Most powerful volcanic eruptions", teaser: "Eruptions that changed the climate.",             cat: "nature",      votes: 219 },
            { topic: "Longest rivers in the world",      teaser: "The Nile vs. Amazon debate, by the numbers.",      cat: "nature",      votes: 196 },
            { topic: "Biggest ships ever built",         teaser: "Floating giants longer than skyscrapers are tall.",cat: "engineering", votes: 174 },
            { topic: "Largest planets in the solar system", teaser: "Gas giants ranked by pure bulk.",             cat: "space",       votes: 163 },
            { topic: "Hottest places on Earth",          teaser: "Where the thermometer gives up.",                 cat: "nature",      votes: 158 },
            { topic: "Deadliest pandemics in history",   teaser: "The outbreaks that reshaped the world.",          cat: "history",     votes: 147 }
        ];

        const VOTED_KEY = "extt_voted_topics";
        const RECENT_KEY = "extt_recent_topics";

        function getVoted() {
            try { return JSON.parse(localStorage.getItem(VOTED_KEY) || "[]"); }
            catch { return []; }
        }
        function votesFor(t) {
            const v = localStorage.getItem("extt_votes_" + t.topic);
            return v === null ? t.votes : parseInt(v, 10);
        }

        function renderTrending() {
            const grid = document.getElementById("trending");
            const voted = getVoted();
            const items = TRENDING_SEED.slice().sort((a, b) => votesFor(b) - votesFor(a));
            grid.innerHTML = items.map(t => {
                const c = CATS[t.cat] || CATS.nature;
                const v = votesFor(t);
                const isVoted = voted.includes(t.topic);
                return `
                <div class="trend-card" style="--cat:${c.color}" onclick='pickTopic(${JSON.stringify(t.topic)})'>
                    <div class="trend-emoji">${c.emoji}</div>
                    <div class="trend-cat">${c.label}</div>
                    <p class="trend-topic">${esc(t.topic)}</p>
                    <p class="trend-teaser">${esc(t.teaser)}</p>
                    <div class="trend-foot">
                        <span class="trend-votes">▲ ${v}</span>
                        <button class="vote-btn${isVoted ? " voted" : ""}" onclick='upvote(event, ${JSON.stringify(t.topic)})'>${isVoted ? "✓ Voted" : "Upvote"}</button>
                    </div>
                </div>`;
            }).join("");
        }

        function upvote(ev, topic) {
            ev.stopPropagation();
            const voted = getVoted();
            if (voted.includes(topic)) return;
            voted.push(topic);
            localStorage.setItem(VOTED_KEY, JSON.stringify(voted));
            const seed = TRENDING_SEED.find(t => t.topic === topic);
            localStorage.setItem("extt_votes_" + topic, String(votesFor(seed) + 1));
            renderTrending();
        }

        function pickTopic(topic) {
            document.getElementById("topicInput").value = topic;
            fetchTopTen();
        }

        function recordRecent(topic) {
            let recent = [];
            try { recent = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch {}
            recent = [topic].concat(recent.filter(t => t.toLowerCase() !== topic.toLowerCase())).slice(0, 8);
            localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
            renderRecent();
        }

        function renderRecent() {
            let recent = [];
            try { recent = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch {}
            const wrap = document.getElementById("recentWrap");
            if (!recent.length) { wrap.style.display = "none"; return; }
            wrap.style.display = "";
            document.getElementById("recent").innerHTML = recent.map(t =>
                `<span class="recent-chip" onclick='pickTopic(${JSON.stringify(t)})'>${esc(t)}</span>`
            ).join("");
        }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        /* ---------- views ---------- */
        function showHome() {
            document.getElementById("resultsView").style.display = "none";
            document.getElementById("homeView").style.display = "";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
        function showResults(html) {
            document.getElementById("homeView").style.display = "none";
            const v = document.getElementById("resultsView");
            v.innerHTML = html;
            v.style.display = "";
            window.scrollTo({ top: 0 });
        }

        /* ---------- loading ---------- */
        const LOAD_MSGS = [
            "Waking the server…",
            "Consulting the record books…",
            "Verifying measurements…",
            "Ranking the contenders…",
            "Polishing the trophies…"
        ];
        let loadTimer = null;
        function startLoading() {
            let i = 0;
            showResults(`
                <div class="res-top">
                    <button class="back-btn" onclick="cancelLoad()">← Topics</button>
                    <span class="src-pill">working…</span>
                </div>
                <div class="loading-box">
                    <div class="spinner"></div>
                    <div class="loading-msg" id="loadMsg">${LOAD_MSGS[0]}</div>
                    <div class="loading-sub">First load can take ~20 seconds on the free tier.<br>Hang tight — good lists are worth it.</div>
                </div>`);
            loadTimer = setInterval(() => {
                i = (i + 1) % LOAD_MSGS.length;
                const el = document.getElementById("loadMsg");
                if (el) el.textContent = LOAD_MSGS[i];
            }, 1600);
        }
        function stopLoading() { if (loadTimer) { clearInterval(loadTimer); loadTimer = null; } }
        let abortCtrl = null;
        function cancelLoad() { stopLoading(); if (abortCtrl) abortCtrl.abort(); showHome(); }

        function handleKeyPress(e) { if (e.key === 'Enter') fetchTopTen(); }

        function medalFor(rank) {
            if (rank === 1) return `<span class="medal">🥇</span>`;
            if (rank === 2) return `<span class="medal">🥈</span>`;
            if (rank === 3) return `<span class="medal">🥉</span>`;
            return `<span class="rank-num">#${esc(rank)}</span>`;
        }

        async function fetchTopTen() {
            const topic = document.getElementById('topicInput').value.trim();
            if (!topic) return;
            abortCtrl = new AbortController();
            startLoading();
            try {
                const response = await fetch('/api/get-top-ten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: topic }),
                    signal: abortCtrl.signal
                });
                const resData = await response.json();
                if (!response.ok) throw new Error(resData.detail || 'Failed to fetch data');
                stopLoading();

                const data = resData.data;
                const live = resData.source !== 'cache';
                const items = (data.items || []).map(item => `
                    <div class="res-item" onclick="this.classList.toggle('open')">
                        <div class="res-row">
                            ${medalFor(item.rank)}
                            <span class="res-name">${esc(item.name)}</span>
                            <span class="stat-badge">${esc(item.key_stat)}</span>
                            <span class="chev">▾</span>
                        </div>
                        <div class="res-detail">
                            <p>${esc(item.summary)}</p>
                            <div class="res-meta">
                                <span>📍 ${esc(item.location_or_year)}</span>
                                <span>📚 ${esc(item.source)}</span>
                            </div>
                        </div>
                    </div>`).join("");

                showResults(`
                    <div class="res-top">
                        <button class="back-btn" onclick="showHome()">← Topics</button>
                        <span class="src-pill${live ? " live" : ""}">${live ? "⚡ generated live" : "💾 from cache"}</span>
                    </div>
                    <h2 class="res-title">${esc(data.title)}</h2>
                    <p class="res-desc">${esc(data.description)}</p>
                    <div>${items}</div>`);
                recordRecent(topic);
            } catch (err) {
                stopLoading();
                if (err.name === 'AbortError') return;
                showResults(`
                    <div class="res-top">
                        <button class="back-btn" onclick="showHome()">← Topics</button>
                        <span class="src-pill">error</span>
                    </div>
                    <div class="err-card"><p>😞 ${esc(err.message)}</p></div>`);
            }
        }

        // Warm up the free-tier instance while the visitor browses,
        // so the first generation doesn't pay the full cold-start cost.
        fetch('/api/health').catch(() => {});
        renderTrending();
        renderRecent();
    </script>
</body>
</html>
